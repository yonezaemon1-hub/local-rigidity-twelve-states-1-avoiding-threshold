name: Repair canonical Paper 13 source

on:
  push:
    paths:
      - '.github/workflows/repair-paper.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact canonical paper.tex
        run: |
          set -euo pipefail
          cat .repair/paper.b64.* | base64 -d > paper.tex.fixed
          echo '9f6e416674532618944f81697871cf03e14be2de8ada3f59a713a0bc69839080  paper.tex.fixed' | sha256sum -c -
          test "$(wc -c < paper.tex.fixed)" = '21878'
          mv paper.tex.fixed paper.tex
          rm -rf .repair
          rm -f .github/workflows/repair-paper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore canonical Paper 13 v6.1 source'
          git push
