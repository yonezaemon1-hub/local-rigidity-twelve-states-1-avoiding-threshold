name: Bootstrap Paper 13 repository

on:
  push:
    paths:
      - 'bootstrap-ready.txt'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and expand audited release candidate
        run: |
          set -euo pipefail
          cat .bootstrap/package.b64.* | base64 -d > /tmp/Paper13_PreDOI_Release_Candidate_2026-09-09.zip
          echo 'b642311f2d3089760d80ecf8f7b8f4d65890360821a7fdc652296ae83c509e1e  /tmp/Paper13_PreDOI_Release_Candidate_2026-09-09.zip' | sha256sum -c -
          rm -rf /tmp/paper13_rc
          mkdir -p /tmp/paper13_rc
          unzip -q /tmp/Paper13_PreDOI_Release_Candidate_2026-09-09.zip -d /tmp/paper13_rc
          cp -a /tmp/paper13_rc/release_candidate/. .
          rm -rf .bootstrap bootstrap-ready.txt
          rm -f .github/workflows/bootstrap-paper13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Paper 13 pre-DOI release candidate'
          git push
